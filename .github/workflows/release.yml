name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift run GlintTests
      - name: Build universal app
        run: make zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Glint.zip \
            --title "Glint ${GITHUB_REF_NAME#v}" \
            --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md)
